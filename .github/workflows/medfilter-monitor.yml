name: Medfilter procurement monitor

on:
  schedule:
    # Каждые 3 часа
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "medfilter-monitor/**"
      - ".github/workflows/medfilter-monitor.yml"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medfilter-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: medfilter-monitor/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: medfilter-monitor/data/procurements.db
          key: medfilter-db-${{ github.run_id }}
          restore-keys: |
            medfilter-db-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAMIA_API_KEY: ${{ secrets.DAMIA_API_KEY }}
          MONITOR_PROVIDERS: clearspending,zakupki_html,damia
        run: |
          mkdir -p data
          python -m medfilter_monitor run -v

      - name: Build public site
        run: |
          python -m medfilter_monitor export-site --out public --limit 120

      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurements-db
          path: medfilter-monitor/data/procurements.db
          if-no-files-found: ignore

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: medfilter-public-site
          path: medfilter-monitor/public

      - name: Deploy to GitHub Pages (gh-pages)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/medfilter-procurement-monitor-827a'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: medfilter-monitor/public
          destination_dir: medfilter
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Deploy public showcase to ZeroDeploy
        if: ${{ secrets.ZERODEPLOY_CLAIM_TOKEN != '' }}
        working-directory: medfilter-monitor/public
        env:
          ZERODEPLOY_CLAIM_TOKEN: ${{ secrets.ZERODEPLOY_CLAIM_TOKEN }}
        run: |
          set -euo pipefail
          tar -czf /tmp/medfilter-site.tar.gz .
          RESP=$(curl -sS -X POST "https://api.zerodeploy.dev/drop" \
            -H "Content-Type: application/gzip" \
            -H "X-Claim-Token: ${ZERODEPLOY_CLAIM_TOKEN}" \
            --data-binary @/tmp/medfilter-site.tar.gz)
          echo "$RESP" | tee "$GITHUB_WORKSPACE/medfilter-monitor/public/zerodeploy.json"
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("zerodeploy.json")
          data = json.loads(p.read_text())
          url = (data.get("data") or {}).get("url")
          print(f"ZeroDeploy URL: {url}")
          if url:
              print(f"::notice title=Public showcase::{url}")
          PY

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medfilter-monitor"
version = "1.0.0"
description = "Агент мониторинга закупок фильтров для медицинского оборудования в РФ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
medfilter-monitor = "medfilter_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

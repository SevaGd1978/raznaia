# Поисковые запросы и правила релевантности для фильтров медтехники (РФ)

queries:
  - фильтр дыхательный
  - тепло влагообменник бактериальный фильтр
  - бактериальный фильтр ИВЛ
  - фильтр для аппарата ИВЛ
  - HME фильтр
  - диализатор гемодиализ
  - фильтр гемодиализный
  - фильтр инфузионный
  - фильтр для медицинских газов
  - HEPA фильтр медицинский
  - фильтр эндотрахеальный
  - контур дыхательный фильтр

# Положительные маркеры в предмете / названии
include_terms:
  - фильтр
  - диализатор
  - тепло/влагообменник
  - теплообменник
  - влагообменник
  - hme
  - hepa
  - бактериальн
  - вирусн
  - дыхательн
  - ивл
  - гемодиализ
  - инфузион
  - медицинских газов
  - наркозно
  - анестезиолог

# Контекст «медицина / оборудование»
medical_context:
  - медицин
  - здравоохран
  - больниц
  - поликлин
  - клинич
  - стационар
  - реанимац
  - анестез
  - диализ
  - ивл
  - аппарат
  - изделие медицин

# Отсекаем явно нерелевантное
exclude_terms:
  - автомобил
  - маслян
  - топливн
  - гидравлич
  - вентиляция здания
  - кондиционер
  - очистка воды питьевой
  - бассейн
  - аквариум
  - пылесос
  - стиральн

# ОКПД2 (подсказки для Damia / HTML-поиска)
okpd2:
  - "32.50"
  - "32.50.13"
  - "32.50.21"
  - "28.25.14"

# Минимальный score для алерта (0..100)
min_score: 45

# Максимум алертов за один цикл (антиспам при первом запуске)
max_notify_per_run: 30

# Глубина выборки на запрос (держим скромно из‑за rate-limit ClearSpending ~100/сутки)
per_query_limit: 15

# Запросы для мониторинга частных фирм / коммерческих закупок
private_queries:
  - Нефролайн диализатор закупка
  - Медси бактериальный фильтр
  - ИНВИТРО закупка фильтр
  - частная клиника дыхательный фильтр тендер
  - коммерческая закупка диализатор
  - B2B фильтр ИВЛ медицинский
  - EMC фильтр дыхательный закупка

# Актуальность: старше N дней не алертим (но сохраняем в базу)
max_age_days: 200
require_fresh_for_notify: true

# Законы
laws:
  - 44
  - 223

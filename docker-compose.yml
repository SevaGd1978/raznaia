services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raznaia
      POSTGRES_PASSWORD: raznaia
      POSTGRES_DB: raznaia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raznaia -d raznaia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://raznaia:raznaia@db:5432/raznaia
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
